name: Build / Development

on:
  push:
    branches:
      - 'dev'
  pull_request_target:
    types:
      - edited
      - opened
      - reopened
      - synchronize

jobs:
  build-dev:
    name: ${{ matrix.targets.alias }}
    runs-on: ${{ matrix.targets.os }}

    strategy:
      fail-fast: false
      matrix:
        targets:
          # mac
          - { os: macos-latest       , target: aarch64-apple-darwin     , alias: aarch64-apple-darwin       }
          - { os: macos-latest       , target: x86_64-apple-darwin      , alias: x86_64-apple-darwin        }
          # linux
          - { os: ubuntu-latest      , target: x86_64-unknown-linux-gnu , alias: x86_64-unknown-linux-gnu   }
          - { os: ubuntu-latest      , target: x86_64-unknown-linux-musl, alias: x86_64-unknown-linux-musl  }
          # freebsd
          - { os: ubuntu-latest      , target: x86_64-unknown-freebsd   , alias: x86_64-unknown-freebsd     }
          # windows
          - { os: windows-latest     , target: x86_64-pc-windows-msvc   , alias: x86_64-pc-windows-msvc     }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1  # 浅克
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dsherret/rust-toolchain-file@v1

      - name: Show Rust toolchain version
        shell: bash
        run: |
          cargo -V
          cargo clippy -V
          cargo fmt -- -V
          rustc -V

      - name: Setup musl-tools
        if: matrix.targets.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: sudo apt -y install musl-tools

      - name: Add target
        uses: ./.github/actions/add-target
        with:
          target: ${{ matrix.targets.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.targets.alias }}

      - name: Generate version
        id: gen-version
        shell: bash
        run: echo 'VERSION=0.0.0-${{ github.sha }}' >> $GITHUB_OUTPUT

      - name: Replace version
        uses: ./.github/actions/replace-version
        with:
          version: ${{ steps.gen-version.outputs.VERSION }}

      - name: Run check
        uses: ./.github/actions/check

      - name: Run test
        uses: ./.github/actions/test

      - name: Run build
        uses: ./.github/actions/build
        with:
          target: ${{ matrix.targets.target }}
          release: false

      # - name: Generate artifacts name
      #   id: gen-name
      #   shell: bash
      #   run: echo 'NAME=cnb-dev-${{ matrix.targets.alias }}' >> $GITHUB_OUTPUT

